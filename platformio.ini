[platformio]
default_envs = nm-cyd-c5
boards_dir = boards/_jsonfiles
src_dir = src

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/esp32-arduino-libs-20251001-233155.zip
build_src_filter = +<*>
extra_scripts = pre:scripts/patch_cc1101_spi_symbol.py
monitor_filters = esp32_exception_decoder, send_on_enter, colorize
monitor_speed = 115200
framework = arduino
build_src_flags =
    -Wall
    -Wclobbered
    -Wempty-body
    -Wignored-qualifiers
    -Wno-overloaded-virtual
    -Wtype-limits
    -Wno-unused-label
    -Wno-comment
    -Wno-unused-variable
    -Wno-narrowing
build_flags =
    -Os
    -Wl,--print-memory-usage
    -Wl,--gc-sections
    -Wl,--allow-multiple-definition
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
    mikalhart/TinyGPSPlus@1.1.0
    sui77/rc-switch@2.6.4
    kosme/arduinoFFT@2.0.4
    nrf24/RF24@1.4.11
    lsatan/SmartRC-CC1101-Driver-Lib@2.5.7
    adafruit/Adafruit PN532@1.3.4
    t-vk/ESP32 BLE Keyboard@0.3.2

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -Iinclude
build_src_filter =
    -<*>
    +<core/>
    +<board/>
    +<features/>
    +<drivers/>
    +<platform/>
    +<services/SettingsService.cpp>
    +<services/StorageService.cpp>
    +<services/pure/>
lib_deps =

[env:esp32-cyd]
platform = espressif32@6.9.0
board = esp32dev
upload_speed = 460800
board_build.partitions = huge_app.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -Iinclude
    -DUSER_SETUP_LOADED
    -include include/User_Setup.h
    -DFAILURE_HANDLING
lib_deps = ${env.lib_deps}

[env:nm-cyd-c5]
board = nm-cyd-c5
board_build.partitions = huge_app.csv
board_build.variants_dir = boards
extra_scripts =
    ${env.extra_scripts}
    pre:scripts/patch_tft_espi_c5.py
    pre:scripts/patch_ble_keyboard_arduino3.py
build_src_filter = ${env.build_src_filter} +<../boards/NM-CYD-C5>
build_flags =
    ${env.build_flags}
    -Iinclude
    -Iboards/NM-CYD-C5
    -DUSER_SETUP_LOADED
    -include include/User_Setup.h
    -DNM_CYD_C5=1
    -DBOARD_HAS_PSRAM=1
    -DDEVICE_NAME='"NM-CYD-C5"'
    -DOTA_TAG='"NM-CYD-C5"'
    -DHAS_TOUCH=1
    -DPART_16MB=1
    -DDIMMER_SETUP=60
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DROTATION=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=25
    -DTFT_RST=-1
    -DTFT_DC=24
    -DTFT_MISO=2
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=23
    -DTOUCH_CS=1
    -DBOARD_HAS_TF=1
    -DSDCARD_CS=10
    -DSDCARD_SCK=TFT_SCLK
    -DSDCARD_MISO=TFT_MISO
    -DSDCARD_MOSI=TFT_MOSI
    -DFAILURE_HANDLING
